name: Nightly JSONBin Backup

on:
  schedule:
    # Runs at 09:00 UTC every day (~4am Central during CDT, ~3am during CST).
    # GitHub Actions cron can slip by a few minutes during high load — that's normal.
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # lets you trigger a backup manually from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest bin data
        env:
          JSONBIN_API_KEY: ${{ secrets.JSONBIN_API_KEY }}
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
        run: |
          mkdir -p backups
          curl -sf "https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest" \
            -H "X-Master-Key: ${JSONBIN_API_KEY}" \
            -o backups/latest.json

          # Sanity check: make sure we actually got JSON, not an error page/empty file
          if ! python3 -c "import json,sys; json.load(open('backups/latest.json'))" 2>/dev/null; then
            echo "::error::Downloaded file isn't valid JSON — aborting so we don't commit garbage."
            cat backups/latest.json
            exit 1
          fi

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/latest.json
          if git diff --staged --quiet; then
            echo "No changes since last backup — nothing to commit."
          else
            git commit -m "Nightly backup: $(date -u +'%Y-%m-%d')"
            git push
          fi
